<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-lists engins de manutention – Lambres 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0ED; --surface:#FFFFFF; --line:#D5DBD6; --line-2:#E7EBE8; --head:#F5F7F5;
  --ink:#17221D; --ink-2:#4D5A53; --ink-3:#7C8781;
  --brand:#0E6B43; --brand-2:#0A5233; --brand-soft:#CFE6D9;
  --yellow:#F5C400; --yellow-soft:#FFF8D9;
  --ok:#17834A; --ok-bg:#E1F2E7;
  --m:#975800; --m-solid:#E08A00; --m-bg:#FFF0D6;
  --hs:#B8231A; --hs-solid:#D42B1E; --hs-bg:#FCE4E1;
  --fut:#7C8781; --fut-bg:#ECEFED;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 var(--body);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

#app{display:flex;flex-direction:column;height:100vh;min-height:620px}

/* ---------- Barre haute ---------- */
.top{display:flex;align-items:center;gap:14px 24px;flex-wrap:wrap;padding:12px 24px;background:var(--brand);color:#fff}
.top h1{font:600 24px/1.1 var(--cond);margin:0;letter-spacing:.005em}
.top .site{margin:2px 0 0;font-size:14px;color:var(--brand-soft)}
.datebar{display:flex;align-items:center;gap:6px;margin-left:auto}
.datebar input{background:#fff;color:var(--ink);border:0;border-radius:var(--r);padding:5px 10px;font:600 17px/1.2 var(--cond);height:36px}
.btn-top{height:36px;min-width:36px;padding:0 12px;border-radius:var(--r);border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-top:hover{background:rgba(255,255,255,.2)}
.btn-top:disabled{opacity:.4;cursor:default}
.btn-top.square{padding:0}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--brand-soft)}
.sync.err{color:#FFD7D2}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Bandeaux info ---------- */
.banner{margin:12px 24px 0;padding:10px 14px;border-radius:var(--r);font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.demo{background:var(--yellow-soft);border:1px solid #EBD56B}
.banner.error{background:var(--hs-bg);border:1px solid #F0B1AA;color:var(--hs)}
.banner button{border:1px solid currentColor;background:#fff;border-radius:var(--r);padding:3px 10px;color:inherit}

/* ---------- Bandeau des postes ---------- */
.shifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(300px,auto);gap:12px;padding:16px 24px 0}
.shift{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;display:grid;grid-template-columns:1fr auto;column-gap:12px;align-content:start}
.shift:hover{border-color:#AEB8B2}
.shift.is-sel{border-color:var(--ink);box-shadow:inset 0 5px 0 var(--yellow)}
.shift-name{font:600 21px/1.1 var(--cond);display:flex;align-items:center;gap:8px}
.shift-hours{font-size:13px;color:var(--ink-3)}
.shift-count{grid-column:2;grid-row:1/3;align-self:center;font:600 36px/1 var(--cond)}
.shift-count small{font-size:19px;font-weight:500;color:var(--ink-3)}
.bar{grid-column:1/-1;display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--fut-bg);margin-top:12px}
.bar i{display:block;height:100%}
.b-done{background:var(--ok)}
.b-miss{background:var(--hs-solid)}
.b-todo{background:repeating-linear-gradient(-45deg,var(--m-solid) 0 4px,#F6C776 4px 8px)}
.shift-state{grid-column:1/-1;margin-top:8px;font-size:13.5px;color:var(--ink-2)}
.shift-state b{font-weight:600}
.live{width:9px;height:9px;border-radius:50%;background:var(--m-solid);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,138,0,.55)}70%{box-shadow:0 0 0 8px rgba(224,138,0,0)}100%{box-shadow:0 0 0 0 rgba(224,138,0,0)}}
.signals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.signal{text-align:left;background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;align-content:center}
.signal b{grid-row:1/3}
.signal.hs{border-left-color:var(--hs-solid)}
.signal.m{border-left-color:var(--m-solid)}
.signal.is-on{border-color:var(--ink);border-left-color:inherit}
.signal.hs.is-on{border-left-color:var(--hs-solid)} .signal.m.is-on{border-left-color:var(--m-solid)}
.signal b{font:600 36px/1 var(--cond)}
.signal.hs b{color:var(--hs)} .signal.m b{color:var(--m)}
.signal.zero b{color:var(--ink-3)}
.signal span{font-weight:600;font-size:14.5px;line-height:1.2;align-self:end}
.signal small{align-self:start}
.signal small{font-size:13px;color:var(--ink-3)}
.daysum{padding:10px 24px 0;font-size:14px;color:var(--ink-2)}
.daysum b{color:var(--ink);font-weight:600}

/* ---------- Onglets & outils ---------- */
.tabs{display:flex;gap:2px;padding:8px 24px 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:9px 14px 8px;font:600 17px/1.2 var(--cond);color:var(--ink-2);display:inline-flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tab .count{font:600 12px/1 var(--body);background:var(--hs-solid);color:#fff;border-radius:999px;padding:3px 7px}
.tab .count.m{background:var(--m-solid)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 24px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;line-height:1.3}
.chip:hover{border-color:#AEB8B2}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{color:var(--ink-3);margin-left:5px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .n{color:#B8C3BD}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.field{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 10px;font-size:14px}
input.field{width:150px}

/* ---------- Zone principale ---------- */
main{flex:1;min-height:280px;overflow:auto;padding:0 24px 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:9px 12px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle}
thead th{position:sticky;top:0;z-index:2;background:var(--head);font:600 15px/1.2 var(--cond);color:var(--ink-2);border-bottom:1px solid var(--line);white-space:nowrap}
thead th:first-child{border-top-left-radius:var(--r)} thead th:last-child{border-top-right-radius:var(--r)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFBFA}
th.c,td.c{text-align:center}
th.r,td.r{text-align:right}
.th-btn{background:none;border:0;padding:0;font:inherit;color:inherit}
th.col-sel{background:var(--yellow);color:var(--ink)}
td.col-sel,tbody tr:hover td.col-sel{background:#FFFBEA}
tr.grp td{background:var(--head);padding:7px 12px;font-size:13.5px;color:var(--ink-2);border-bottom:1px solid var(--line)}
tr.grp td b{font:600 16px var(--cond);color:var(--ink);margin-right:10px}
tbody tr.grp:hover td{background:var(--head)}
.engin{font:600 19px/1.1 var(--cond);letter-spacing:.01em}
.type{display:inline-block;margin-top:3px;font-size:12px;color:var(--ink-3)}
.type.out{color:var(--m)}
.sect{font-size:14px;color:var(--ink-2)}
.hor{font-size:14px;color:var(--ink-2);white-space:nowrap}

/* pastilles poste */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px 4px 9px;font-size:13.5px;font-weight:600;border:1px solid transparent;background:none;white-space:nowrap;line-height:1.25}
button.pill:hover{filter:brightness(.96)}
.p-fait{background:var(--ok-bg);color:var(--ok)}
.p-nonfait{background:var(--hs-bg);color:var(--hs)}
.p-afaire{background:#fff;color:var(--m);border:1.5px dashed var(--m-solid)}
.p-avenir{background:var(--fut-bg);color:var(--fut);font-weight:500}
.res{font:700 12px/1 var(--body);border-radius:4px;padding:3px 5px;color:#fff;margin-left:2px}
.res-M{background:var(--m-solid)} .res-HS{background:var(--hs-solid)}
.mult{font-size:11.5px;font-weight:600;opacity:.75}

/* état du chariot */
.etat{display:flex;align-items:center;gap:9px;min-width:170px}
.code{font:700 14px/1 var(--cond);border-radius:4px;padding:5px 0;width:36px;text-align:center;color:#fff;flex:none;letter-spacing:.02em}
.e-OK{background:var(--ok)} .e-M{background:var(--m-solid)} .e-HS{background:var(--hs-solid)} .e-NA{background:#B7C0BB}
.etat-t{font-size:14px;font-weight:600;line-height:1.2}
.etat-s{display:block;font-size:12.5px;font-weight:400;color:var(--ink-3)}
.btn-link{background:none;border:1px solid var(--line);border-radius:var(--r);padding:5px 10px;font-size:13.5px;font-weight:500;color:var(--brand-2);white-space:nowrap}
.btn-link:hover{border-color:var(--brand);background:#F3F9F5}

/* vue semaine */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;color:var(--ink-2);margin:2px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sq{display:inline-block;width:17px;height:17px;border-radius:3px;border:0;padding:0;margin:0 1.5px;vertical-align:middle}
button.sq:hover{transform:scale(1.15)}
.s-OK{background:var(--ok)} .s-M{background:var(--m-solid)} .s-HS{background:var(--hs-solid)}
.s-miss{background:var(--hs-bg);box-shadow:inset 0 0 0 1.5px var(--hs-solid)}
.s-todo{background:#fff;box-shadow:inset 0 0 0 1.5px var(--m-solid)}
.s-fut{background:var(--fut-bg)}
.wk th.day{text-align:center;font-size:14px;line-height:1.15}
.wk th.day span{display:block;font:500 12.5px var(--body);color:var(--ink-3)}
.wk th.day.is-d{box-shadow:inset 0 -3px 0 var(--yellow)}
.wk td.day{text-align:center;padding:8px 6px;white-space:nowrap}
.wk tfoot td{background:var(--head);font-size:13.5px;font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.rate{font-weight:600;font-variant-numeric:tabular-nums}
.rate.good{color:var(--ok)} .rate.mid{color:var(--m)} .rate.bad{color:var(--hs)}
.rate small{font-weight:400;color:var(--ink-3);margin-left:4px}

/* points à traiter */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);margin-bottom:10px}
.seg button{border:0;background:none;padding:6px 14px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.ans{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.a-OK{background:var(--ok-bg);color:var(--ok)}
.a-M{background:var(--m-bg);color:var(--m)}
.a-HS{background:var(--hs-bg);color:var(--hs)}
.a-OUI{background:var(--ok-bg);color:var(--ok)}
.a-NON{background:#fff;color:var(--m);box-shadow:inset 0 0 0 1px #EBC27E}
.a-NA,.a-NR,.a-INFO{background:var(--fut-bg);color:var(--fut);font-weight:500}
tr.click{cursor:pointer}
.com{font-size:13.5px;color:var(--ink-2);max-width:360px}

.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font:600 19px var(--cond);color:var(--ink);margin-bottom:4px}
.loading{padding:60px 20px;text-align:center;color:var(--ink-3)}

/* ---------- Fiche détail ---------- */
dialog{border:0;border-radius:10px;padding:0;width:min(880px,96vw);max-height:94vh;color:var(--ink);background:var(--surface);box-shadow:0 24px 70px rgba(8,30,18,.35)}
dialog::backdrop{background:rgba(14,32,22,.5)}
.d-head{display:flex;align-items:flex-start;gap:16px;padding:18px 22px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:3}
.d-title{font:600 30px/1 var(--cond);margin:0}
.d-meta{margin-top:5px;font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px}
.d-close{margin-left:auto;width:36px;height:36px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:20px;line-height:1;flex:none}
.d-close:hover{background:var(--head)}
.d-body{padding:16px 22px 22px}
.hist{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.hist-day{flex:1;min-width:76px;text-align:center;padding:6px 4px 7px;border-radius:var(--r);border:1px solid transparent}
.hist-day.is-d{background:var(--head);border-color:var(--line)}
.hist-day .lbl{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:5px;white-space:nowrap}
.hist-day .sq.is-cur{outline:2px solid var(--ink);outline-offset:1.5px}
.ptabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ptab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;font:600 16px/1.1 var(--cond)}
.ptab[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--yellow)}
.alert{display:flex;gap:10px;align-items:center;border-radius:var(--r);padding:11px 14px;font-weight:600;margin-bottom:14px}
.alert.hs{background:var(--hs-solid);color:#fff}
.alert.m{background:var(--m-bg);color:var(--m);border:1px solid #F0CE8E}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 18px;margin:0 0 16px}
.meta div{min-width:0}
.meta dt{font-size:12.5px;color:var(--ink-3)}
.meta dd{margin:1px 0 0;font-weight:600;overflow-wrap:anywhere}
.pts td{padding:8px 10px}
.pts td:first-child{width:34px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pts .q{font-weight:600}
.pts .qs{display:block;font-size:12.5px;color:var(--ink-3);font-weight:400;margin-top:1px}
.pts tr.is-HS td{background:#FFF6F5} .pts tr.is-M td{background:#FFFBF2}
.comment{margin-top:14px;padding:12px 14px;background:var(--head);border-radius:var(--r);font-size:14.5px;white-space:pre-wrap}
.comment b{display:block;font-size:12.5px;color:var(--ink-3);font-weight:400;margin-bottom:2px}
.photos{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.photos img{height:120px;border-radius:var(--r);border:1px solid var(--line)}
.d-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:500;color:var(--ink);text-decoration:none;font-size:14px}
.btn:hover{background:var(--head)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2)}
.saisie{margin:22px 0 10px;padding-top:16px;border-top:1px dashed var(--line);font:600 16px var(--cond);color:var(--ink-2)}
.saisie:first-child{margin-top:0;padding-top:0;border-top:0}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .shifts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .signals{grid-column:1/-1}
}
@media (max-width:760px){
  .top,.shifts,.tabs,.toolbar,.daysum{padding-left:14px;padding-right:14px}
  main{padding:0 14px 16px}
  .shifts{grid-template-columns:1fr}
  .tools{margin-left:0}
  .datebar{margin-left:0}
  .pill .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){.live,.spin{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <h1>Suivi des check-lists engins de manutention</h1>
      <p class="site" id="site-label">Lambres 1</p>
    </div>
    <div class="datebar">
      <button class="btn-top square" data-act="prev" aria-label="Jour précédent">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input type="date" id="date" aria-label="Date affichée">
      <button class="btn-top square" data-act="next" id="btn-next" aria-label="Jour suivant">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn-top" data-act="today" id="btn-today">Poste en cours</button>
    </div>
    <div class="sync" id="sync"></div>
    <a class="btn-top" id="btn-form" target="_blank" rel="noopener" hidden>Remplir une check-list</a>
  </header>

  <div id="banners"></div>
  <section class="shifts" id="shifts" aria-label="Avancement par poste"></section>
  <p class="daysum" id="daysum"></p>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="jour">Suivi du jour</button>
    <button class="tab" role="tab" data-tab="semaine">Semaine</button>
    <button class="tab" role="tab" data-tab="points">Points à traiter <span class="count" id="pts-count" hidden></span></button>
  </nav>

  <div class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="Filtrer par secteur"></div>
    <div class="tools">
      <select class="field" id="filtre" aria-label="Filtrer les engins">
        <option value="tous">Tous les engins</option>
        <option value="manquante">Check-list manquante</option>
        <option value="HS">Engins HS</option>
        <option value="M">Maintenance à prévoir</option>
      </select>
      <select class="field" id="tri" aria-label="Trier">
        <option value="secteur">Trier par secteur</option>
        <option value="engin">Trier par n° d'engin</option>
        <option value="etat">HS et maintenance en tête</option>
        <option value="manquante">Manquantes en tête</option>
      </select>
      <input class="field" id="q" type="search" placeholder="N° d'engin" aria-label="Rechercher un engin" autocomplete="off">
    </div>
  </div>

  <main id="view" tabindex="-1"></main>
</div>

<dialog id="detail" aria-labelledby="d-title"></dialog>

<script>
/* =====================================================================
   CONFIGURATION — à adapter
   ===================================================================== */
const CONFIG = {
  // URL de ton Worker Cloudflare (sans "/" final). Vide = mode démonstration.
  API_BASE: "",

  // Alias des tables, tels que déclarés dans worker.js
  TABLE_CHECKLIST: "checklist",
  TABLE_ENGINS: "engins",            // null = liste des engins déduite des check-lists saisies

  SITE: "LAMBRES",                   // filtre sur le champ Site ("" = aucun filtre)
  FUSEAU: "Europe/Paris",

  // Noms des champs de la table "Check List Vérification des engins"
  CHAMPS_CHECKLIST: {
    numero: "Numéro check list", site: "Site", engin: "N° Engin", date: "Date",
    poste: "Poste", secteur: "Secteurs", horametre: "Horamètre", commentaire: "Commentaire"
  },
  // Noms des champs de la table "Engins"
  CHAMPS_ENGINS: {
    numero: "Numero Engin", caces: "Type", modele: "Modèle", serie: "N° de série", fournisseur: "Fournisseur",
    secteur: "Secteur", site: "Site", localisation: "Localisation",
    energie: "Énergie"   // champ absent pour l'instant : à créer (Électrique / Thermique) pour griser les points batterie / huile
  },
  // Engins dont la Localisation contient l'un de ces textes : pas de check-list attendue (non comptés)
  LOCALISATIONS_NON_SUIVIES: ["Extérieur"],
  // Secteur affiché pour un engin : "engins" = secteur de la table Engins (repli : dernière check-list)

const toMin = h => { const [a, b] = String(h).split(":").map(Number); return a * 60 + (b || 0); };

function shiftNow(now = new Date()) {
  const t = now.getHours() * 60 + now.getMinutes();
  let date = localISO(now);
  for (const p of POSTES) {
    const wraps = p.end <= p.start;
    const inside = wraps ? (t >= p.start || t < p.end) : (t >= p.start && t < p.end);
    if (inside) {

function timeState(date, i) {

function matchPoste(s) {

const shortLabel = q => { const n = norm(q); const hit = LIBELLES.find(([re]) => re.test(n)); return hit ? hit[1] : q.replace(/\s*\(.*?\)\s*/g, " ").trim(); };

const SEV = { HS: 3, M: 2, NON: CONFIG.NON_EST_ANOMALIE ? 2 : 0 };

const isQuestion = k => k.includes("?");

function normalizeCheck(r) {
  const enginRaw = r[CF.engin];
  const points = [], extras = [], files = [];
  for (const [k, v] of Object.entries(r)) {
    if (META_KEYS.has(k)) continue;
    if (Array.isArray(v) && v.length && v[0] && typeof v[0] === "object" && "url" in v[0]) { files.push(...v); continue; }
    if (isQuestion(k)) { const raw = txt(v); points.push({ question: k, label: shortLabel(k), raw, status: normStatus(raw), scope: scopeOf(k) }); }
    else if (txt(v) && !/check list|checklist/i.test(k)) extras.push({ k, v: txt(v) });
  }
  return {
    id: r.id, num: txt(r[CF.numero]) || String(r.id),
    enginId: linkIds(enginRaw)[0] ?? null, enginName: (Array.isArray(enginRaw) ? txt(enginRaw[0]) : txt(enginRaw)).trim(),
    date: parseDate(r[CF.date]), poste: matchPoste(txt(r[CF.poste])), posteRaw: txt(r[CF.poste]),
    secteur: txt(r[CF.secteur]), site: txt(r[CF.site]), horametre: txt(r[CF.horametre]),
    commentaire: txt(r[CF.commentaire]), points, extras, files
  };
}

function normalizeEngin(r, linkName) {
  const EF = CONFIG.CHAMPS_ENGINS;
  const get = (want, re) => {
    if (want && want in r) return r[want];
    const k = Object.keys(r).find(k => re.test(norm(k)));
    return k ? r[k] : undefined;
  };
  let nom = txt(get(EF.numero, /^n(um(ero)?|°|o)\.? ?d?.?engin/)).trim() || linkName.get(r.id) || "";
  if (!nom) for (const [k, v] of Object.entries(r)) { if (k !== "id" && k !== "order" && (typeof v === "string" || typeof v === "number") && String(v).trim()) { nom = String(v).trim(); break; } }
  if (!nom) return null;
  const site = txt(get(EF.site, /^site/));
  if (CONFIG.SITE && site && !norm(site).includes(norm(CONFIG.SITE))) return null;
  const actif = get(EF.actif, /^actif|^en service/);
  if (actif === false || ["non", "inactif", "false"].includes(norm(txt(actif)))) return null;
  const localisation = txt(get(EF.localisation, /localisation|emplacement/));
  const energie = txt(get(EF.energie, /energie|motoris/));
  return {
    key: "id:" + r.id, rowId: r.id, nom,
    caces: txt(get(EF.caces, /caces/)), modele: txt(get(EF.modele, /^modele/)).trim(), serie: txt(get(EF.serie, /serie/)),
    fournisseur: txt(get(EF.fournisseur, /fournisseur|loueur/)), localisation, energie, typeKey: typeKey(energie),
    secteurRef: txt(get(EF.secteur, /secteur/)), horsRef: false,
    nonSuivi: !!localisation && (CONFIG.LOCALISATIONS_NON_SUIVIES || []).some(x => norm(localisation).includes(norm(x)))
  };
}
const typeKey = t => { const n = norm(t); return n.includes("therm") ? "thermique" : n.includes("elec") ? "electrique" : ""; };

function evaluate(c) {
  const t = c.engin?.typeKey || "";
  let worst = 0, nbM = 0, nbHS = 0;
  c.pts = c.points.map(p => {
    const status = t && p.scope !== "all" && p.scope !== t ? "NA" : p.status;
    const sev = SEV[status] || 0;
    if (sev === 3) nbHS++; else if (sev === 2) nbM++;
    worst = Math.max(worst, sev);
    return { ...p, status, sev };
  });
  c.level = worst === 3 ? "HS" : worst === 2 ? "M" : "OK";
  c.nbM = nbM; c.nbHS = nbHS;
}

function buildModel(enginRows, checkRows) {
  const checks = [], linkName = new Map();
  for (const r of checkRows) {
    const c = normalizeCheck(r);
    if (!c.date) continue;
    if (CONFIG.SITE && c.site && !norm(c.site).includes(norm(CONFIG.SITE))) continue;
    if (c.enginId != null && c.enginName) linkName.set(c.enginId, c.enginName);
    checks.push(c);
  }
  const engins = [], exclus = [], byId = new Map(), byName = new Map();
  for (const r of enginRows) {
    const e = normalizeEngin(r, linkName);
    if (!e) continue;
    (e.nonSuivi ? exclus : engins).push(e);
    byId.set(r.id, e); byName.set(norm(e.nom), e);
  }
  const hasRef = engins.length > 0;
  for (const c of checks) {
    let e = (c.enginId != null && byId.get(c.enginId)) || byName.get(norm(c.enginName));
    if (e && e.nonSuivi) continue;              // engin hors site : check-list ignorée
    if (!e) {
      if (!c.enginName) continue;
      e = { key: "n:" + norm(c.enginName), nom: c.enginName, type: "", typeKey: "", secteurRef: "", horsRef: hasRef };
      engins.push(e); byName.set(norm(c.enginName), e);
    }
    c.engin = e;
  }
  const sortKey = c => `${c.date}|${c.poste ?? 9}|${String(c.id).padStart(10, "0")}`;
  const valid = checks.filter(c => c.engin).sort((a, b) => sortKey(a) < sortKey(b) ? -1 : 1);
  const byCell = new Map(), byEngin = new Map();
  for (const c of valid) {
    evaluate(c);
    if (!byEngin.has(c.engin.key)) byEngin.set(c.engin.key, []);
    byEngin.get(c.engin.key).push(c);
    if (c.poste != null) {
      const k = `${c.engin.key}|${c.date}|${c.poste}`;
      if (!byCell.has(k)) byCell.set(k, []);
      byCell.get(k).unshift(c);                 // plus récente en premier
    }
  }
  for (const e of engins) {
    const list = byEngin.get(e.key) || [];
    const fromCheck = list.length ? list[list.length - 1].secteur : "";
    e.secteur = (CONFIG.SOURCE_SECTEUR === "checklist" ? fromCheck || e.secteurRef : e.secteurRef || fromCheck) || "";

async function api(alias, params = {}) {
  const url = new URL(CONFIG.API_BASE.replace(/\/+$/, "") + "/rows/" + alias);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  url.searchParams.set("user_field_names", "true");
  let r;
  try { r = await fetch(url, { cache: "no-store" }); }
  catch (e) { const err = new Error("network"); err.network = true; throw err; }
  if (!r.ok) {
    const err = new Error("HTTP " + r.status); err.status = r.status;
    try { const j = await r.json(); err.detail = j.error || j.detail || j.message || JSON.stringify(j); } catch {}
    throw err;
  }
  return r.json();
}
async function fetchAll(alias, params = {}, first = null) {
  const out = []; let page = 1, d = first;
  while (true) {
    if (!d) d = await api(alias, { ...params, size: 200, page });
    out.push(...d.results);
    if (!d.next || page >= 500) break;
    page++; d = null;
  }
  return out;
}
/** Check-lists entre deux dates. Essaie le filtre Baserow, sinon parcourt la table depuis la fin. */
async function fetchChecks(from, to) {
  const lo = addDays(from, -1), hi = addDays(to, 1);
  const inWide = r => { const d = parseDate(r[CF.date]); return d && d >= lo && d <= hi; };
  if (CONFIG.FILTRE_API) {
    const filters = JSON.stringify({ filter_type: "AND", filters: [
      { type: "date_is_on_or_after", field: CF.date, value: `${CONFIG.FUSEAU}?${lo}?exact_date` },
      { type: "date_is_on_or_before", field: CF.date, value: `${CONFIG.FUSEAU}?${hi}?exact_date` }
    ] });
    try {
      const first = await api(CONFIG.TABLE_CHECKLIST, { filters, size: 200, page: 1 });
      if (first.results.every(inWide)) return fetchAll(CONFIG.TABLE_CHECKLIST, { filters }, first);
      console.warn("Filtre de date ignoré par Baserow : parcours de la table.");
      return scanFromEnd(from, first);
    } catch (e) {
      if (e.status !== 400) throw e;
      console.warn("Filtre de date refusé par Baserow (400) : parcours de la table.", e.detail);
    }
  }
  return scanFromEnd(from);
}
async function scanFromEnd(from, head = null) {
  const size = 200;
  head = head || await api(CONFIG.TABLE_CHECKLIST, { size, page: 1 });
  const last = Math.max(1, Math.ceil(head.count / size));
  const stop = addDays(from, -7), out = [];
  for (let p = last; p >= 1; p--) {
    const d = p === 1 ? head : await api(CONFIG.TABLE_CHECKLIST, { size, page: p });
    out.push(...d.results);
    const dates = d.results.map(r => parseDate(r[CF.date])).filter(Boolean);
    if (dates.length && dates.every(x => x < stop)) break;
  }
  return out;
}
function describeError(e) {
  if (e.network) return `Impossible de joindre le Worker (${CONFIG.API_BASE}). Vérifie l'URL dans CONFIG.API_BASE et que cette page est bien dans ALLOWED_ORIGINS.`;
  if (e.status === 401 || (e.status === 403 && !/origine/i.test(e.detail || ""))) return `Baserow refuse l'accès (${e.status}). Vérifie le token BASEROW_TOKEN du Worker et ses droits de lecture sur les deux tables.`;
  if (e.status === 403) return e.detail;
  if (e.status === 404) return `Table introuvable (404). Vérifie TABLE_CHECKLIST et TABLE_ENGINS dans les variables du Worker. ${e.detail || ""}`;
  return `Erreur ${e.status || ""} pendant le chargement. ${e.detail || e.message || ""}`;
}

async function loadData({ silent = false } = {}) {
  const to = state.date, from = addDays(to, -(CONFIG.JOURS_HISTORIQUE - 1));
  const tok = ++loadSeq;
  state.loading = true;
  if (!silent) render(); else renderSync();
  try {
    let enginRows, checkRows;
    const inRange = r => { const d = parseDate(r[CF.date]); return d && d >= from && d <= to; };
    if (DEMO) {

const ready = () => state.model && state.range && state.range.to === state.date;
const secteurOrder = s => { const i = CONFIG.SECTEURS.findIndex(x => norm(x) === norm(s)); return i < 0 ? (s ? 50 : 99) : i; };
const sortSecteurs = arr => [...arr].sort((a, b) => secteurOrder(a) - secteurOrder(b) || cmpNat(a, b));

function baseList() {

  return state.secteur === "Tous" ? all : all.filter(e => norm(e.secteur) === norm(state.secteur));
}
function isMissing(e) {

}
function filtered(list) {
  const q = norm(state.q);
  return list.filter(e => {
    if (q && !norm(e.nom).includes(q)) return false;
    if (state.filtre === "HS" || state.filtre === "M") { const lk = lastKnown(e, state.date); if (!lk || lk.level !== state.filtre) return false; }
    if (state.filtre === "manquante" && !isMissing(e)) return false;
    return true;

function sorted(list) {
  const bySect = (a, b) => secteurOrder(a.secteur) - secteurOrder(b.secteur) || cmpNat(a.secteur, b.secteur);
  const lvl = e => { const lk = lastKnown(e, state.date); return lk ? ({ HS: 3, M: 2, OK: 0 })[lk.level] : 1; };
  const out = [...list];
  if (state.tri === "engin") out.sort((a, b) => cmpNat(a.nom, b.nom));
  else if (state.tri === "etat") out.sort((a, b) => lvl(b) - lvl(a) || bySect(a, b) || cmpNat(a.nom, b.nom));
  else if (state.tri === "manquante") out.sort((a, b) => isMissing(b) - isMissing(a) || bySect(a, b) || cmpNat(a.nom, b.nom));
  else out.sort((a, b) => bySect(a, b) || cmpNat(a.nom, b.nom));
  return out;
}
function dayStats(list, d) {

    for (const e of list) if (cellChecks(e, d, p.i).length) done++;
    const total = list.length;
    return { p, st, done, total, miss: st === "past" ? total - done : 0, todo: st === "current" ? total - done : 0 };
  });
  let hs = 0, m = 0;
  for (const e of list) { const lk = lastKnown(e, d); if (lk?.level === "HS") hs++; else if (lk?.level === "M") m++; }
  const expected = per.filter(x => x.st !== "future").reduce((s, x) => s + x.total, 0);
  const done = per.filter(x => x.st !== "future").reduce((s, x) => s + x.done, 0);
  const miss = per.reduce((s, x) => s + x.miss, 0);
  return { per, hs, m, expected, done, miss };
}
function anomalyItems(list) {
  const items = [];
  const push = (e, c) => { for (const p of c.pts) if (p.sev >= 2) items.push({ e, c, p }); };
  if (state.scope === "actuel") { for (const e of list) { const lk = lastKnown(e, state.date); if (lk) push(e, lk); } }
  else for (const e of list) for (const c of state.model.byEngin.get(e.key) || []) if (c.date <= state.date) push(e, c);
  return items;
}
const rateClass = r => r >= 0.95 ? "good" : r >= 0.8 ? "mid" : "bad";

/* =====================================================================
   RENDU
   ===================================================================== */
function render() {
  $("#date").value = state.date;
  $("#date").max = addDays(state.now.date, 1);
  $("#btn-next").disabled = state.date >= addDays(state.now.date, 1);
  $("#btn-today").disabled = state.date === state.now.date && state.poste === state.now.i;
  $("#filtre").value = state.filtre; $("#tri").value = state.tri;
  if ($("#q").value !== state.q) $("#q").value = state.q;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === state.tab)));
  if (CONFIG.FORMULAIRE_URL) { const a = $("#btn-form"); a.hidden = false; a.href = CONFIG.FORMULAIRE_URL; }
  renderSync(); renderBanners();
  if (!ready()) {
    $("#shifts").innerHTML = ""; $("#daysum").textContent = ""; $("#chips").innerHTML = "";
    $("#view").innerHTML = state.error ? "" : `<div class="loading">Chargement des check-lists…</div>`;
    return;
  }
  const list = baseList();
  renderShifts(list); renderChips();
  const n = anomalyItems(filtered(list)).length;
  const cnt = $("#pts-count");
  const hasHS = anomalyItems(list).some(x => x.p.sev === 3);
  cnt.hidden = !n; cnt.textContent = n; cnt.className = "count" + (hasHS ? "" : " m");
  $("#filtre").options[1].disabled = state.tab === "points";
  const view = $("#view");
  const scroll = view.scrollTop;
  view.innerHTML = state.tab === "semaine" ? viewWeek(list) : state.tab === "points" ? viewPoints(list) : viewDay(list);
  view.scrollTop = scroll;
  if (state.detail && $("#detail").open) renderDetail();
}

function renderSync() {
  const el = $("#sync");
  if (state.loading) { el.className = "sync"; el.innerHTML = `<span class="spin" aria-hidden="true"></span>Chargement…`; return; }
  el.className = "sync" + (state.error ? " err" : "");
  const t = state.updatedAt ? state.updatedAt.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "—";
  el.innerHTML = `<span>${state.error ? "Échec de l'actualisation" : "Mis à jour à " + t}</span>
    <button class="btn-top" data-act="refresh">Actualiser</button>`;
}
function renderBanners() {
  let h = "";
  if (DEMO) h += `<div class="banner demo"><b>Mode démonstration</b><span>Check-lists fictives générées sur ton parc réel (export Engins du 09/11) + les 6 lignes réelles du 01/10/2026. Renseigne <code>CONFIG.API_BASE</code> pour lire la table Baserow.</span></div>`;
  if (state.error) h += `<div class="banner error">${ICON.warn}<span>${esc(state.error)}</span><button data-act="refresh">Réessayer</button></div>`;
  $("#banners").innerHTML = h;
}

function renderShifts(list) {
  const s = dayStats(list, state.date);
  const cards = s.per.map(x => {
    const sel = x.p.i === state.poste;
    const pct = v => x.total ? (v / x.total * 100).toFixed(2) + "%" : "0%";
    let bar = `<i class="b-done" style="width:${pct(x.done)}"></i>`;
    if (x.st === "past") bar += `<i class="b-miss" style="width:${pct(x.miss)}"></i>`;
    if (x.st === "current") bar += `<i class="b-todo" style="width:${pct(x.todo)}"></i>`;
    let stTxt;
    if (x.st === "future") stTxt = "À venir";
    else if (x.st === "current") stTxt = x.todo ? `En cours : <b>${plural(x.todo, "check-list restante", "check-lists restantes")}</b>` : "En cours : toutes les check-lists sont faites";
    else stTxt = x.miss ? `Terminé : <b>${plural(x.miss, "check-list non faite", "check-lists non faites")}</b>` : (x.total ? "Terminé : toutes les check-lists sont faites" : "Terminé");
    return `<button class="shift${sel ? " is-sel" : ""}" data-act="poste" data-i="${x.p.i}" aria-pressed="${sel}">
      <span class="shift-name">${esc(x.p.nom)}${x.st === "current" ? '<span class="live" title="Poste en cours"></span>' : ""}</span>
      <span class="shift-hours">${esc(x.p.debut)} – ${esc(x.p.fin)}</span>
      <span class="shift-count num">${x.done}<small>/${x.total}</small></span>
      <span class="bar" aria-hidden="true">${bar}</span>
      <span class="shift-state">${stTxt}</span>
    </button>`;
  }).join("");
  const on = f => state.filtre === f ? " is-on" : "";
  const signals = `<div class="signals">
    <button class="signal hs${s.hs ? "" : " zero"}${on("HS")}" data-act="sig" data-f="HS" aria-pressed="${state.filtre === "HS"}">
      <b class="num">${s.hs}</b><span>${s.hs > 1 ? "Engins HS" : "Engin HS"}</span><small>arrêt immédiat</small></button>
    <button class="signal m${s.m ? "" : " zero"}${on("M")}" data-act="sig" data-f="M" aria-pressed="${state.filtre === "M"}">
      <b class="num">${s.m}</b><span>Maintenance</span><small>à prévoir</small></button>
  </div>`;
  $("#shifts").innerHTML = cards + signals;
  const sum = $("#daysum");
  if (!s.expected) sum.innerHTML = `Journée du ${esc(fmtLong(state.date))} : à venir.`;
  else sum.innerHTML = `Journée du ${esc(fmtLong(state.date))} : <b>${s.done}</b> ${s.done > 1 ? "check-lists faites" : "check-list faite"} sur ${s.expected} ${s.expected > 1 ? "attendues" : "attendue"}`
    + ` (<span class="rate ${rateClass(s.done / s.expected)}">${Math.round(s.done / s.expected * 100)} %</span>)`
    + (s.miss ? `, dont <b>${s.miss}</b> ${s.miss > 1 ? "non faites" : "non faite"} sur les postes terminés.` : ".");
  const ex = state.model.exclus;
  if (ex.length) sum.innerHTML += ` <span title="${esc(ex.map(e => `${e.nom} : ${e.localisation}`).join("\n"))}">${ex.length > 1 ? `${ex.length} engins hors site ne sont pas suivis` : "1 engin hors site n'est pas suivi"} (${esc(ex.map(e => e.nom).join(", "))}).</span>`;
}

function renderChips() {
  const all = state.model.engins;
  const counts = new Map();
  for (const e of all) counts.set(e.secteur || "", (counts.get(e.secteur || "") || 0) + 1);
  const secs = sortSecteurs([...counts.keys()].filter(Boolean));
  if (counts.has("")) secs.push("");
  if (state.secteur !== "Tous" && !secs.some(s => norm(s) === norm(state.secteur))) secs.push(state.secteur);
  const chip = (val, label, n) => `<button class="chip" data-act="secteur" data-s="${esc(val)}" aria-pressed="${norm(state.secteur) === norm(val)}">${esc(label)}<span class="n">${n}</span></button>`;
  $("#chips").innerHTML = chip("Tous", "Tous", all.length) + secs.map(s => chip(s, s || "Sans secteur", counts.get(s) || 0)).join("");
}

/* ----- Vue du jour ----- */
function cellHtml(e, d, i) {
  const list = cellChecks(e, d, i), st = timeState(d, i);
  const cls = i === state.poste ? ' class="c col-sel"' : ' class="c"';
  const attrs = `data-act="open" data-e="${esc(e.key)}" data-d="${d}" data-p="${i}"`;
  if (list.length) {
    const c = list[0];
    const res = c.level !== "OK" ? `<span class="res res-${c.level}">${c.level}</span>` : "";
    const mult = list.length > 1 ? `<span class="mult" title="${list.length} check-lists saisies">×${list.length}</span>` : "";
    return `<td${cls}><button class="pill p-fait" ${attrs} title="Voir la check-list">${ICON.check}<span class="lbl">Fait</span>${res}${mult}</button></td>`;
  }
  if (st === "past") return `<td${cls}><button class="pill p-nonfait" ${attrs}>${ICON.x}<span class="lbl">Non fait</span></button></td>`;
  if (st === "current") return `<td${cls}><button class="pill p-afaire" ${attrs}>${ICON.clock}<span class="lbl">À faire</span></button></td>`;
  return `<td${cls}><span class="pill p-avenir">${ICON.dash}<span class="lbl">À venir</span></span></td>`;
}
function etatHtml(lk, d) {
  if (!lk) return `<div class="etat"><span class="code e-NA">?</span><span class="etat-t">Aucun relevé<span class="etat-s">sur ${CONFIG.JOURS_HISTORIQUE} jours</span></span></div>`;
  const when = lk.date === d ? `Relevé ${posteNom(lk.poste)}` : `Relevé du ${fmtShort(lk.date)}, ${posteNom(lk.poste)}`;
  const det = lk.level === "HS" ? ` (${plural(lk.nbHS, "point HS", "points HS")})` : lk.level === "M" ? ` (${plural(lk.nbM, "point", "points")})` : "";
  return `<div class="etat"><span class="code e-${lk.level}">${lk.level}</span><span class="etat-t">${LEVEL_TXT[lk.level]}<span class="etat-s">${esc(when)}${det}</span></span></div>`;
}
function enginCell(e) {
  const t = e.horsRef ? `<span class="type out" title="Engin présent dans les check-lists mais absent de la table Engins">Hors table Engins</span>`
    : e.caces || e.modele ? `<span class="type">${esc([e.caces, e.modele].filter(Boolean).join(", "))}</span>` : "";
  return `<td><div class="engin num">${esc(e.nom)}</div>${t}</td>`;
}
function viewDay(list) {
  const d = state.date, rows = sorted(filtered(list));
  if (!state.model.engins.length) return emptyBox("Aucun engin trouvé", "Vérifie la table Engins ou les champs déclarés dans CONFIG.");
  if (!rows.length) return emptyBox("Aucun engin ne correspond aux filtres", "Change de secteur ou efface la recherche.");
  const head = POSTES.map(p => `<th class="c${p.i === state.poste ? " col-sel" : ""}"><button class="th-btn" data-act="poste" data-i="${p.i}">${esc(p.nom)}</button></th>`).join("");
  const group = state.tri === "secteur" && state.secteur === "Tous";
  let body = "", last = null;
  for (const e of rows) {
    if (group && e.secteur !== last) {
      last = e.secteur;
      const g = rows.filter(x => x.secteur === last);
      const st = timeState(d, state.poste);
      const done = g.filter(x => cellChecks(x, d, state.poste).length).length;
      const info = st === "future" ? `${plural(g.length, "engin", "engins")}` : `${done} sur ${g.length} faites au poste ${esc(posteNom(state.poste))}`;
      body += `<tr class="grp"><td colspan="${POSTES.length + 4}"><b>${esc(last || "Sans secteur")}</b>${info}</td></tr>`;
    }
    const lk = lastKnown(e, d);
    body += `<tr>${enginCell(e)}${group ? "" : `<td class="sect">${esc(e.secteur || "—")}</td>`}
      ${POSTES.map(p => cellHtml(e, d, p.i)).join("")}
      <td>${etatHtml(lk, d)}</td>
      <td class="hor r num">${lk && lk.horametre ? esc(fmtNum(lk.horametre)) + " h" : "—"}</td>
      <td class="r"><button class="btn-link" data-act="detail" data-e="${esc(e.key)}">Voir détail</button></td></tr>`;
  }
  return `<div class="card"><table>
    <thead><tr><th>N° engin</th>${group ? "" : "<th>Secteur</th>"}${head}<th>État du chariot</th><th class="r">Horamètre</th><th class="r"><span hidden>Détail</span></th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}

/* ----- Vue semaine ----- */
function squareHtml(e, d, i, extraCls = "") {
  const list = cellChecks(e, d, i), st = timeState(d, i);
  let cls, lab;
  if (list.length) { cls = "s-" + list[0].level; lab = "fait, " + LEVEL_TXT[list[0].level].toLowerCase(); }
  else if (st === "past") { cls = "s-miss"; lab = "non fait"; }
  else if (st === "current") { cls = "s-todo"; lab = "à faire (poste en cours)"; }
  else { cls = "s-fut"; lab = "à venir"; }
  const title = `${fmtWeekday(d)} ${fmtShort(d)}, ${posteNom(i)} : ${lab}`;
  if (cls === "s-fut") return `<span class="sq ${cls}" title="${esc(title)}"></span>`;
  return `<button class="sq ${cls}${extraCls}" data-act="open" data-e="${esc(e.key)}" data-d="${d}" data-p="${i}" title="${esc(title)}" aria-label="${esc(title)}"></button>`;
}
function weekDays() { const out = []; for (let k = CONFIG.JOURS_HISTORIQUE - 1; k >= 0; k--) out.push(addDays(state.date, -k)); return out; }
function viewWeek(list) {
  const rows = sorted(filtered(list)), days = weekDays();
  if (!rows.length) return emptyBox("Aucun engin ne correspond aux filtres", "Change de secteur ou efface la recherche.");
  const head = days.map(d => `<th class="day${d === state.date ? " is-d" : ""}">${esc(fmtWeekday(d))}<span>${fmtShort(d)}</span></th>`).join("");
  const rateHtml = (done, exp) => exp ? `<span class="rate ${rateClass(done / exp)}">${Math.round(done / exp * 100)} %<small>${done}/${exp}</small></span>` : `<span class="rate">—</span>`;
  const body = rows.map(e => {
    let done = 0, exp = 0;
    const cells = days.map(d => `<td class="day">${POSTES.map(p => {
      if (timeState(d, p.i) !== "future") { exp++; if (cellChecks(e, d, p.i).length) done++; }
      return squareHtml(e, d, p.i);
    }).join("")}</td>`).join("");
    return `<tr>${enginCell(e)}<td class="sect">${esc(e.secteur || "—")}</td>${cells}<td class="r">${rateHtml(done, exp)}</td></tr>`;
  }).join("");
  let tDone = 0, tExp = 0;
  const foot = days.map(d => {
    let done = 0, exp = 0;
    for (const e of rows) for (const p of POSTES) if (timeState(d, p.i) !== "future") { exp++; if (cellChecks(e, d, p.i).length) done++; }
    tDone += done; tExp += exp;
    return `<td class="day">${exp ? `<span class="rate ${rateClass(done / exp)}">${Math.round(done / exp * 100)} %</span>` : "—"}</td>`;
  }).join("");
  return `<div class="legend">
      <span>Chaque jour, de gauche à droite : ${POSTES.map(p => esc(p.nom)).join(", ")}.</span>
      <span><i class="sq s-OK"></i>Fait, apte</span><span><i class="sq s-M"></i>Fait, maintenance</span><span><i class="sq s-HS"></i>Fait, HS</span>
      <span><i class="sq s-miss"></i>Non fait</span><span><i class="sq s-todo"></i>À faire</span><span><i class="sq s-fut"></i>À venir</span>
    </div>
    <div class="card"><table class="wk">
    <thead><tr><th>N° engin</th><th>Secteur</th>${head}<th class="r">Réalisation</th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td colspan="2">Taux de réalisation</td>${foot}<td class="r">${rateHtml(tDone, tExp)}</td></tr></tfoot>
    </table></div>`;
}

/* ----- Points à traiter ----- */
function viewPoints(list) {
  let items = anomalyItems(filtered(list));
  if (state.filtre === "HS") items = items.filter(x => x.p.sev === 3);
  if (state.filtre === "M") items = items.filter(x => x.p.sev === 2);
  items.sort((a, b) => b.p.sev - a.p.sev || (a.c.date < b.c.date ? 1 : a.c.date > b.c.date ? -1 : 0) || (b.c.poste ?? 0) - (a.c.poste ?? 0) || cmpNat(a.e.nom, b.e.nom));
  const seg = `<div class="seg" role="group" aria-label="Période">
    <button data-act="scope" data-s="actuel" aria-pressed="${state.scope === "actuel"}">État actuel (dernier relevé par engin)</button>
    <button data-act="scope" data-s="histo" aria-pressed="${state.scope === "histo"}">Tous les relevés sur ${CONFIG.JOURS_HISTORIQUE} jours</button></div>`;
  if (!items.length) return seg + emptyBox("Aucun point HS ou en maintenance", state.scope === "actuel" ? "Le dernier relevé de chaque engin affiché est conforme." : "Aucune anomalie relevée sur la période.");
  const body = items.map(({ e, c, p }) => `<tr class="click" data-act="open" data-e="${esc(e.key)}" data-d="${c.date}" data-p="${c.poste ?? ""}" data-id="${c.id}">
      <td><span class="ans a-${p.status}">${p.status === "HS" ? "HS" : p.status === "NON" ? "Non" : "M"}</span></td>
      <td><b>${esc(p.label)}</b></td>
      <td><span class="engin num" style="font-size:17px">${esc(e.nom)}</span></td>
      <td class="sect">${esc(e.secteur || "—")}</td>
      <td class="sect">${esc(fmtWeekday(c.date))} ${fmtShort(c.date)}, ${esc(posteNom(c.poste))}</td>
      <td class="com">${esc(c.commentaire || "—")}</td></tr>`).join("");
  return seg + `<div class="card"><table>
    <thead><tr><th>Statut</th><th>Point de contrôle</th><th>N° engin</th><th>Secteur</th><th>Relevé</th><th>Commentaire</th></tr></thead>
    <tbody>${body}</tbody></table></div>`;
}
const emptyBox = (t, s) => `<div class="card empty"><b>${esc(t)}</b>${esc(s)}</div>`;

/* ----- Fiche détail ----- */
function openDetail(key, date, poste, id) {
  const e = state.model.byKey.get(key);
  if (!e) return;
  if (poste == null || poste === "") {
    const here = POSTES.map(p => p.i).filter(i => cellChecks(e, date, i).length);
    poste = cellChecks(e, date, state.poste).length ? state.poste : here.length ? here[here.length - 1] : state.poste;
  }
  state.detail = { key, date, poste: Number(poste), id: id ? Number(id) : null };
  renderDetail();
  const dlg = $("#detail");
  if (!dlg.open) dlg.showModal();
}
function formUrl(e, d, i) {
  if (!CONFIG.FORMULAIRE_URL) return "";
  const u = new URL(CONFIG.FORMULAIRE_URL);
  u.searchParams.set("prefill_" + CF.engin, e.nom);
  u.searchParams.set("prefill_" + CF.poste, posteNom(i));
  u.searchParams.set("prefill_" + CF.date, d);
  return u.toString();
}
function renderDetail() {
  const { key, date, poste, id } = state.detail;
  const e = state.model.byKey.get(key);
  if (!e) return;
  const lk = lastKnown(e, state.date);
  const hist = weekDays().map(d => `<div class="hist-day${d === date ? " is-d" : ""}"><span class="lbl">${esc(fmtWeekday(d))} ${fmtShort(d)}</span>${
    POSTES.map(p => squareHtml(e, d, p.i, d === date && p.i === poste ? " is-cur" : "")).join("")}</div>`).join("");
  const ptabs = POSTES.map(p => {
    const l = cellChecks(e, date, p.i), st = timeState(date, p.i);
    const ic = l.length ? `<span class="code e-${l[0].level}" style="width:auto;padding:3px 5px;font-size:12px">${l[0].level}</span>`
      : st === "past" ? `<span style="color:var(--hs)">${ICON.x}</span>` : st === "current" ? `<span style="color:var(--m)">${ICON.clock}</span>` : `<span style="color:var(--fut)">${ICON.dash}</span>`;
    return `<button class="ptab" data-act="dposte" data-i="${p.i}" aria-pressed="${p.i === poste}">${esc(p.nom)} ${ic}</button>`;
  }).join("");

  let list = cellChecks(e, date, poste);
  if (id) { const sel = state.model.byEngin.get(key)?.find(c => c.id === id); if (sel && !list.includes(sel)) list = [sel]; }
  let body;
  if (!list.length) {
    const st = timeState(date, poste);
    const msg = st === "past" ? ["Check-list non faite", `Aucune check-list n'a été saisie pour le poste ${posteNom(poste)} du ${fmtDate(date)}.`]
      : st === "current" ? ["Check-list à faire", `Le poste ${posteNom(poste)} est en cours et la check-list n'est pas encore saisie.`]
      : ["Poste à venir", `Le poste ${posteNom(poste)} du ${fmtDate(date)} n'a pas commencé.`];
    const f = st !== "future" ? formUrl(e, date, poste) : "";
    body = `<div class="card empty"><b>${esc(msg[0])}</b>${esc(msg[1])}${f ? `<div class="d-actions" style="justify-content:center"><a class="btn primary" href="${esc(f)}" target="_blank" rel="noopener">Remplir la check-list</a></div>` : ""}</div>`;
  } else {
    body = list.map((c, k) => checkHtml(c, k, list.length)).join("");
  }

  $("#detail").innerHTML = `
    <div class="d-head">
      <div>
        <h2 class="d-title num" id="d-title">Engin ${esc(e.nom)}</h2>
        <div class="d-meta">
          <span>${esc(e.secteur || "Sans secteur")}</span>
          ${[e.caces, e.modele && "Modèle " + e.modele, e.serie && "N° de série " + e.serie, e.fournisseur, e.energie].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("")}
          <span>${lk ? `État au ${fmtShort(state.date)} : <b>${LEVEL_TXT[lk.level]}</b>` : "Aucun relevé récent"}</span>
        </div>
      </div>
      <button class="d-close" data-act="close" aria-label="Fermer">×</button>
    </div>
    <div class="d-body">
      <div class="hist" aria-label="Historique ${CONFIG.JOURS_HISTORIQUE} jours">${hist}</div>
      <div class="ptabs" role="group" aria-label="Poste du ${fmtDate(date)}">${ptabs}</div>
      ${body}
    </div>`;
}
function checkHtml(c, k, n) {
  const alert = c.level === "HS" ? `<div class="alert hs">${ICON.warn}Arrêt immédiat de l'engin : prévenir le responsable.</div>`
    : c.level === "M" ? `<div class="alert m">${ICON.warn}Maintenance à prévoir sur ${plural(c.nbM, "point", "points")}.</div>`
    : `<div class="alert ok">${ICON.check}Tous les points sont conformes.</div>`;
  const meta = [
    ["N° check-list", c.num], ["Date", fmtDate(c.date)], ["Poste", c.poste != null ? posteNom(c.poste) : c.posteRaw || "—"],
    ["Secteur", c.secteur || "—"], ["Horamètre", c.horametre ? fmtNum(c.horametre) + " h" : "—"], ...c.extras.map(x => [x.k, x.v])
  ].map(([t, v]) => `<div><dt>${esc(t)}</dt><dd>${esc(v)}</dd></div>`).join("");
  const ansTxt = p => p.status === "NA" ? "Non concerné" : p.status === "NR" ? "Non renseigné" : p.raw;
  const pts = c.pts.map((p, j) => `<tr class="is-${p.status}"><td>${j + 1}</td>
      <td><span class="q">${esc(p.label)}</span><span class="qs">${esc(p.question)}</span></td>
      <td class="r"><span class="ans a-${p.status}">${esc(ansTxt(p))}</span></td></tr>`).join("");
  const photos = c.files.filter(f => f.is_image !== false && (f.thumbnails?.small?.url || f.url));
  const link = CONFIG.LIGNE_BASEROW_URL ? CONFIG.LIGNE_BASEROW_URL.replace("{id}", c.id) : "";
  return `${n > 1 ? `<div class="saisie">Saisie ${k + 1} sur ${n}${k === 0 ? " (la plus récente)" : ""}, n° ${esc(c.num)}</div>` : ""}
    ${alert}
    <dl class="meta">${meta}</dl>
    <div class="card"><table class="pts"><tbody>${pts || `<tr><td colspan="3">Aucun point de contrôle trouvé.</td></tr>`}</tbody></table></div>
    ${c.commentaire ? `<div class="comment"><b>Commentaire</b>${esc(c.commentaire)}</div>` : ""}
    ${photos.length ? `<div class="photos">${photos.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener"><img src="${esc(f.thumbnails?.card_cover?.url || f.thumbnails?.small?.url || f.url)}" alt="${esc(f.visible_name || "Photo")}"></a>`).join("")}</div>` : ""}
    ${link ? `<div class="d-actions"><a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Ouvrir la ligne dans Baserow</a></div>` : ""}`;
}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
function setDate(d) {
  if (!d || d === state.date) return;
  state.date = d;
  loadData();
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act],[data-tab]");
  if (!t) return;
  if (t.dataset.tab) { state.tab = t.dataset.tab; render(); return; }
  const a = t.dataset.act;
  if (a === "prev") setDate(addDays(state.date, -1));
  else if (a === "next") setDate(addDays(state.date, 1));
  else if (a === "today") { state.poste = state.now.i; if (state.date !== state.now.date) setDate(state.now.date); else render(); }
  else if (a === "refresh") loadData();
  else if (a === "poste") { state.poste = Number(t.dataset.i); render(); }
  else if (a === "sig") { state.filtre = state.filtre === t.dataset.f ? "tous" : t.dataset.f; if (state.tab === "semaine") state.tab = "jour"; render(); }
  else if (a === "secteur") { state.secteur = t.dataset.s; render(); }
  else if (a === "scope") { state.scope = t.dataset.s; render(); }
  else if (a === "detail") openDetail(t.dataset.e, state.date, null);
  else if (a === "open") openDetail(t.dataset.e, t.dataset.d, t.dataset.p, t.dataset.id);
  else if (a === "dposte") { state.detail.poste = Number(t.dataset.i); state.detail.id = null; renderDetail(); }
  else if (a === "close") $("#detail").close();
});
$("#detail").addEventListener("click", ev => {
  const t = ev.target.closest("[data-act='open']");
  if (t) { ev.stopPropagation(); state.detail = { key: t.dataset.e, date: t.dataset.d, poste: Number(t.dataset.p), id: null }; renderDetail(); }
  else if (ev.target === ev.currentTarget) ev.currentTarget.close();   // clic sur le fond
}, true);
$("#detail").addEventListener("close", () => { state.detail = null; });
$("#date").addEventListener("change", ev => setDate(ev.target.value));
$("#filtre").addEventListener("change", ev => { state.filtre = ev.target.value; render(); });
$("#tri").addEventListener("change", ev => { state.tri = ev.target.value; render(); });
$("#q").addEventListener("input", ev => { state.q = ev.target.value; render(); });

// Changement de poste et actualisation automatique
let lastRefresh = Date.now();
setInterval(() => {
  const n = shiftNow(), changed = n.date !== state.now.date || n.i !== state.now.i;
  const followLive = state.date === state.now.date && state.poste === state.now.i;
  state.now = n;
  if (changed && followLive) { state.poste = n.i; if (state.date !== n.date) { setDate(n.date); return; } }
  const due = Date.now() - lastRefresh > CONFIG.ACTUALISATION_MIN * 60e3;
  if (state.date >= addDays(n.date, -1) && (due || changed) && !state.loading && !$("#detail").open) { lastRefresh = Date.now(); loadData({ silent: true }); }
  else if (changed && ready()) render();
}, 30e3);
